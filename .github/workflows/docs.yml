name: Docs

# Builds the documentation site from docs/ with Zensical and publishes it to
# GitHub Pages: https://joshua-d-miller.com/macOSLAPS/
#
# Every run checks that docs/settings.md matches the profile manifest and
# that the site builds without warnings (broken links, missing anchors).
# Pushes to main and the 4.0 branch publish; pull requests only check.
#
# One-time setup in the repository: Settings → Pages → Source: GitHub
# Actions. While 4.0 is on ci/github-actions-build, also allow that branch
# and main under Settings → Environments → github-pages → Deployment
# branches.

on:
  push:
    branches: [main, ci/github-actions-build]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'Profile Manifests/**'
      - '.github/scripts/gen-settings-doc.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'Profile Manifests/**'
      - '.github/scripts/gen-settings-doc.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Settings page matches the profile manifest
        run: python3 .github/scripts/gen-settings-doc.py --check
      - name: Build the site
        run: |
          pip install zensical
          zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
