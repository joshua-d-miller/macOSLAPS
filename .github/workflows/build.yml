name: Build & Test

# Builds macOSLAPS on a GitHub-hosted Mac (no local Xcode needed), packages it,
# smoke-tests the pkgs on macOS 15 (arm64 + Intel) / 26, upgrades over the previous release,
# opens the CMS escrow on Windows, and attaches everything to a published release.
#
# Signing is optional. With no secrets set, the build is ad-hoc signed and the pkg
# is unsigned (fine for community testing via `sudo installer -pkg`). Add these
# repository secrets to get Developer ID signed + notarized output:
#   DEVID_APP_P12        base64 of the "Developer ID Application" .p12
#   DEVID_INSTALLER_P12  base64 of the "Developer ID Installer" .p12
#   P12_PASSWORD         password for both .p12 files
#   ASC_KEY_ID           App Store Connect API key ID   (for notarytool)
#   ASC_ISSUER_ID        App Store Connect issuer ID
#   ASC_KEY_P8           contents of the AuthKey_XXXX.p8 file

on:
  push:
    branches: [master]
    tags: ['v*']
  release:
    # Publish a (pre)release on GitHub with a new tag such as 4.0.0(846); this
    # workflow builds that commit, tests it and attaches the signed pkg and notes.
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # only used by the release job on tags

env:
  # Xcode 26 no longer targets 10.13. 12.0 covers every macOS Apple still patches.
  MIN_MACOS: "12.0"

jobs:
  generator-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Compile and run password generator tests
        run: |
          swiftc -O macOSLAPS/Extensions/PasswordPolicy.swift Tests/GeneratorTests/main.swift -o generator-tests
          ./generator-tests
      - name: Compile and run shell helper tests
        run: |
          swiftc macOSLAPS/Extensions/Shell.swift Tests/ShellTests/main.swift -o shell-tests
          ./shell-tests

  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      pkg: ${{ steps.package.outputs.pkg }}
      version: ${{ steps.binary.outputs.version }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Set build number
        id: version
        run: |
          # Release tags carry the build number: 4.0.0(846). Other builds use 845 + run number.
          short=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" macOSLAPS/Info.plist)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" =~ ^([0-9.]+)\(([0-9]+)\)$ ]]; then
            [ "${BASH_REMATCH[1]}" = "$short" ] || { echo "::error::Tag version ${BASH_REMATCH[1]} != Info.plist $short"; exit 1; }
            build=${BASH_REMATCH[2]}
          else
            build=$((845 + GITHUB_RUN_NUMBER))
          fi
          echo "Building $short ($build)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" macOSLAPS/Info.plist

      - name: Build universal binary
        run: |
          xcodebuild -project macOSLAPS.xcodeproj -scheme macOSLAPS -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="$MIN_MACOS" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" CODE_SIGNING_REQUIRED=NO \
            build > xcodebuild.log 2>&1 || { tail -60 xcodebuild.log; exit 1; }
          grep -E "(\*\* BUILD|error:|warning:)" xcodebuild.log | sort -u || true

      - name: Locate binary and read embedded version
        id: binary
        run: |
          bin=build/Build/Products/Release/macOSLAPS
          test -x "$bin" || { echo "::error::binary not found"; ls -la build/Build/Products/Release; exit 1; }
          lipo -info "$bin"
          short="${{ steps.version.outputs.short }}"; build="${{ steps.version.outputs.build }}"
          # Cross-check against the Info.plist embedded in the binary (__TEXT,__info_plist).
          read -r emb_short emb_build < <(python3 - "$bin" <<'PY'
          import plistlib, sys
          data = open(sys.argv[1], "rb").read()
          start = data.find(b"<?xml"); end = data.find(b"</plist>", start)
          info = plistlib.loads(data[start:end + len(b"</plist>")])
          print(info.get("CFBundleShortVersionString", ""), info.get("CFBundleVersion", ""))
          PY
          )
          echo "Expected $short ($build), embedded $emb_short ($emb_build)"
          [ "$emb_short" = "$short" ] && [ "$emb_build" = "$build" ] || { echo "::error::Embedded version $emb_short ($emb_build) does not match $short ($build)"; exit 1; }
          [[ "$short.$build" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version '$short.$build' is not x.y.z.n"; exit 1; }
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "version=$short.$build" >> "$GITHUB_OUTPUT"

      - name: Sign binary
        id: sign
        env:
          DEVID_APP_P12: ${{ secrets.DEVID_APP_P12 }}
          DEVID_INSTALLER_P12: ${{ secrets.DEVID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BIN: ${{ steps.binary.outputs.bin }}
        run: |
          if [ -z "$DEVID_APP_P12" ]; then
            echo "::warning::No signing secrets set. Producing an ad-hoc signed TEST build."
            codesign --force --sign - --options runtime --identifier edu.psu.macOSLAPS "$BIN"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$DEVID_APP_P12"       | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$DEVID_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/inst.p12"
          security import "$RUNNER_TEMP/app.p12"  -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security import "$RUNNER_TEMP/inst.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP"/*.p12
          # The .p12 files may hold only the leaf certificates (e.g. exported on Windows),
          # so add Apple's Developer ID G2 intermediate to complete the chain.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          APP_ID=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          INST_ID=$(security find-identity -v "$KC" | awk -F'"' '/Developer ID Installer/{print $2; exit}')
          codesign --force --timestamp --options runtime --identifier edu.psu.macOSLAPS --sign "$APP_ID" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          echo "KC=$KC" >> "$GITHUB_ENV"
          echo "INST_ID=$INST_ID" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build pkgs
        id: package
        env:
          BIN: ${{ steps.binary.outputs.bin }}
          VERSION: ${{ steps.binary.outputs.version }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          # Three packages with the same receipts and layout as earlier releases:
          # full, binary only, LaunchDaemon only. See packaging/build-pkgs.sh.
          if [ "$SIGNED" = "true" ]; then
            pkg=$(bash packaging/build-pkgs.sh "$BIN" "$VERSION" dist "$INST_ID" "$KC" | tail -1)
          else
            pkg=$(bash packaging/build-pkgs.sh "$BIN" "$VERSION" dist | tail -1)
          fi
          ls -l dist
          for p in dist/*.pkg; do pkgutil --check-signature "$p" | head -3 || true; done
          suffix=""; [ "$SIGNED" = "true" ] || suffix="-UNSIGNED-TEST"
          for name in "macOSLAPS-$VERSION$suffix.pkg" "macOSLAPS-Binary-$VERSION$suffix.pkg" "macOSLAPS-LD-$VERSION$suffix.pkg"; do
            [ -f "dist/$name" ] || { echo "::error::missing dist/$name"; exit 1; }
          done
          [ "$pkg" = "macOSLAPS-$VERSION$suffix.pkg" ] || { echo "::error::unexpected full pkg name '$pkg'"; exit 1; }
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - name: Check signing certificate expiry
        if: steps.sign.outputs.signed == 'true'
        run: |
          # Developer ID certificates from the G2 authority last one year. Warn a month ahead
          # so the DEVID_* secrets get renewed before releases can no longer be signed.
          for name in "Developer ID Application" "Developer ID Installer"; do
            end=$(security find-certificate -c "$name" -p "$KC" | openssl x509 -noout -enddate | cut -d= -f2)
            days=$(( ( $(date -j -f "%b %e %T %Y %Z" "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "$name expires $end ($days days)"
            if [ "$days" -lt 30 ]; then
              echo "::warning::$name certificate expires in $days days. Renew it and update the DEVID_* secrets."
            fi
          done

      - name: Notarize pkgs
        if: steps.sign.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_APP_PASSWORD: ${{ secrets.AC_APP_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
        run: |
          # Preferred: App Store Connect API key. Fallback: Apple ID + app-specific password.
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$ASC_KEY_P8" > "$key"
            auth=(--key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          elif [ -n "$AC_APPLE_ID" ] && [ -n "$AC_APP_PASSWORD" ]; then
            auth=(--apple-id "$AC_APPLE_ID" --password "$AC_APP_PASSWORD" --team-id "${AC_TEAM_ID:-9UYK4F9BSM}")
          else
            echo "::error::Signing secrets are set but no notarization credentials (ASC_* or AC_*)."
            exit 1
          fi
          for PKG in dist/*.pkg; do
            echo "::group::Notarize $PKG"
            out=$(xcrun notarytool submit "$PKG" "${auth[@]}" --wait --output-format json)
            echo "$out"
            status=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
            if [ "$status" != "Accepted" ]; then
              id=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
              [ -n "$id" ] && xcrun notarytool log "$id" "${auth[@]}" || true
              echo "::error::Notarization status for $PKG: $status"
              exit 1
            fi
            xcrun stapler staple "$PKG"
            xcrun stapler validate "$PKG"
            echo "::endgroup::"
          done
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Checksums
        run: cd dist && shasum -a 256 *.pkg | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: macOSLAPS-${{ steps.binary.outputs.version }}
          path: |
            dist/*.pkg
            dist/SHA256SUMS.txt
            xcodebuild.log

      - name: Clean up signing keychain
        if: always()
        run: '[ -n "${KC:-}" ] && security delete-keychain "$KC" || true'

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: macOSLAPS-${{ needs.build.outputs.version }}
          path: artifact
      - name: Install pkg
        run: sudo installer -pkg "artifact/dist/${{ needs.build.outputs.pkg }}" -target /
      - name: Run smoke test
        run: sudo CMS_ARTIFACT_DIR="$RUNNER_TEMP/cms" bash .github/scripts/smoke-test.sh
      - uses: actions/upload-artifact@v5
        if: matrix.os == 'macos-26'
        with:
          name: cms-escrow-sample
          path: ${{ runner.temp }}/cms
          retention-days: 1

  # Install the last published release, rotate with it, then install this build over it.
  upgrade-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: macOSLAPS-${{ needs.build.outputs.version }}
          path: artifact
      - name: Download the previous release (4.0.0 Build 845)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/previous.pkg" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/4.0.0%28845%29/macOSLAPS-4.0.0.845.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/previous.pkg" | head -4
      - name: Upgrade test
        run: sudo bash .github/scripts/upgrade-test.sh "$RUNNER_TEMP/previous.pkg" artifact/dist "${{ needs.build.outputs.signed }}"

  # The CMS escrow must open with the tool Windows admins already have.
  windows-decrypt:
    needs: smoke-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: cms-escrow-sample
          path: cms
      - name: Unprotect-CmsMessage (PowerShell 7)
        shell: pwsh
        run: ./.github/scripts/windows-decrypt.ps1
      - name: Unprotect-CmsMessage (Windows PowerShell 5.1)
        shell: powershell
        run: ./.github/scripts/windows-decrypt.ps1

  release:
    needs: [generator-tests, build, smoke-test, upgrade-test, windows-decrypt]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: macOSLAPS-${{ needs.build.outputs.version }}
          path: artifact
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          short=${VERSION%.*}; build=${VERSION##*.}
          notes=".github/release-notes/${short}.md"
          if [ -f "$notes" ]; then
            cp "$notes" notes.md
          else
            echo "Automated build $VERSION from ${GITHUB_SHA::7}." > notes.md
          fi
          printf '\n---\nBuild %s from commit %s.\n' "$build" "${GITHUB_SHA::7}" >> notes.md
          if [ "$SIGNED" != "true" ]; then
            printf '\n**UNSIGNED TEST BUILD.** Install with `sudo installer -pkg <file> -target /`. Not for production.\n' >> notes.md
          fi
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "macOSLAPS ${short} Build ${build}" --notes-file notes.md
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              artifact/dist/*.pkg artifact/dist/SHA256SUMS.txt
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "macOSLAPS ${short} Build ${build}" --notes-file notes.md \
              artifact/dist/*.pkg artifact/dist/SHA256SUMS.txt
          fi
