name: AD Tests

# Throwaway Samba AD domain controller with the legacy LAPS schema and the
# Windows LAPS schema. Stage 1 checks the domain itself (a computer can write
# its own LAPS attributes, admins can read them, ordinary users can't).
# Stage 2, a macOS runner that joins the domain over Tailscale and runs
# macOSLAPS in AD mode, is in build.yml (jobs ad-dc and ad-mac), because it
# needs the package that workflow builds.

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      # Documentation only: built by docs.yml, and skipping it here keeps
      # test build numbers (1000 + run number) from piling up.
      - 'docs/**'
      - 'zensical.toml'
      - '**.md'
      - '.github/workflows/docs.yml'
      - '.github/scripts/gen-settings-doc.py'
  workflow_dispatch:

# A new push to a pull request cancels that PR's older run, so superseded runs
# don't hold the macOS runners. Pushes to main, tags and releases always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  samba-dc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Provision Samba AD DC with LAPS schemas
        env:
          ADMINPASS: ${{ format('Ci-{0}-Adm!', github.run_id) }}
        run: sudo -E bash .github/scripts/samba/provision-dc.sh
      - name: Verify LAPS attributes and permissions
        env:
          ADMINPASS: ${{ format('Ci-{0}-Adm!', github.run_id) }}
        run: sudo -E bash .github/scripts/samba/verify-dc.sh
