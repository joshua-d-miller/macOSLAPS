name: AD Tests

# Throwaway Samba AD domain controller with the legacy LAPS schema and the
# Windows LAPS schema. Stage 1 checks the domain itself (a computer can write
# its own LAPS attributes, admins can read them, ordinary users can't).
# Stage 2 (added once Tailscale secrets exist) joins a macOS runner and runs
# macOSLAPS in AD mode against it.

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      # Documentation only: built by docs.yml, and skipping it here keeps
      # test build numbers (845 + run number) from piling up.
      - 'docs/**'
      - 'zensical.toml'
      - '**.md'
      - '.github/workflows/docs.yml'
      - '.github/scripts/gen-settings-doc.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samba-dc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Provision Samba AD DC with LAPS schemas
        env:
          ADMINPASS: ${{ format('Ci-{0}-Adm!', github.run_id) }}
        run: sudo -E bash .github/scripts/samba/provision-dc.sh
      - name: Verify LAPS attributes and permissions
        env:
          ADMINPASS: ${{ format('Ci-{0}-Adm!', github.run_id) }}
        run: sudo -E bash .github/scripts/samba/verify-dc.sh
