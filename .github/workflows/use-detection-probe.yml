name: use-detection probe (temporary)
on:
  push:
    branches: [probe/use-detection]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe Endpoint Security events via eslogger
        shell: bash {0}
        run: |
          U=lapsprobe; PW='Probe-Pass-9911'
          sudo sysadminctl -addUser $U -password "$PW" -admin >/dev/null 2>&1
          sudo eslogger --list-events 2>&1 | grep -E "^(authentication|sudo|su|lw_session_login|authorization_judgement|openssh_login)$" | tr '\n' ' '; echo
          sudo eslogger authentication sudo su authorization_judgement > /tmp/es.json 2>/tmp/es.err &
          sleep 5; cat /tmp/es.err
          dscl . -authonly $U "$PW"; echo "dscl authonly rc=$?"
          dscl . -authonly $U wrong-pw >/dev/null 2>&1; echo "dscl wrong rc=$?"
          sudo -u $U bash -c "echo '$PW' | sudo -S -k true" >/dev/null 2>&1; echo "sudo rc=$?"
          expect -c "spawn su $U -c true; expect \"Password:\"; send \"$PW\r\"; expect eof" >/dev/null 2>&1; echo "su rc=$?"
          sleep 5; sudo pkill eslogger; sleep 1
          echo "events captured: $(wc -l < /tmp/es.json)"
          python3 - <<'PY'
          import json
          for line in open('/tmp/es.json'):
              try: e = json.loads(line)
              except Exception: continue
              ev = e.get('event', {}); kind = list(ev.keys())[0] if ev else '?'
              s = json.dumps(ev)
              if 'lapsprobe' not in s: continue
              proc = e.get('process', {}).get('executable', {}).get('path')
              if kind == 'authentication':
                  a = ev['authentication']; od = (a.get('data') or {}).get('od') or {}
                  print(f"authentication type={a.get('type')} success={a.get('success')} record={od.get('record_name')} by={proc}")
              elif kind in ('sudo','su'):
                  d = ev[kind]; print(f"{kind} success={d.get('success')} from={d.get('from_username')} to={d.get('to_username')} by={proc}")
              else:
                  print(kind, s[:200])
          PY
