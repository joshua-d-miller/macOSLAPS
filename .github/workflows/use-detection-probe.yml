name: signing probe (temporary)
on:
  push:
    branches: [probe/use-detection]
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Inspect signatures of past releases
        shell: bash {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in "4.0.0(845)" "3.1.0(843)" "3.0.4(781)" "2.1.0(721)"; do
            echo "================ $tag"
            mkdir -p "r/$tag" && cd "r/$tag"
            gh release download "$tag" --repo joshua-d-miller/macOSLAPS --pattern '*.pkg' >/dev/null 2>&1 || { echo "no pkg asset"; cd - >/dev/null; continue; }
            pkg=$(ls *.pkg | head -1); echo "pkg: $pkg"
            pkgutil --check-signature "$pkg" | sed -n '1,6p'
            pkgutil --expand-full "$pkg" x >/dev/null 2>&1
            bin=$(find x -type f -name 'macOSLAPS' -perm -u+x | head -1); echo "bin: $bin"
            codesign -dv --verbose=2 "$bin" 2>&1 | grep -E "Identifier=|TeamIdentifier|Authority=Developer|Timestamp|flags"
            echo "designated requirement:"; codesign -d -r- "$bin" 2>&1 | grep designated
            cd - >/dev/null
          done
